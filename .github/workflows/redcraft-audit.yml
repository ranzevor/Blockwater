name: RedCraft release audit

on:
  push:
    branches:
      - research/redcraft-release-audit
    paths:
      - tools/audit_redcraft_release.py
      - .github/workflows/redcraft-audit.yml

permissions:
  contents: read

concurrency:
  group: redcraft-release-audit
  cancel-in-progress: false

jobs:
  inspect-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out audit code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify digest and inspect archive
        run: python3 tools/audit_redcraft_release.py
